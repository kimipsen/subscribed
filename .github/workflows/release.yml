name: Container release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: container-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Release checks
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish image and GitHub Release
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Validate release source
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release_metadata.py validate-tag "$RELEASE_TAG"
          git merge-base --is-ancestor HEAD origin/master
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | [.tag_name, .draft] | @tsv' > releases.tsv
          if grep -Fxq "$RELEASE_TAG"$'\tfalse' releases.tsv; then
            echo "Release already published; refusing to rebuild its image." >&2
            exit 1
          fi
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.RELEASE_TAG }}
            ${{ env.IMAGE }}:${{ env.RELEASE_VERSION }}
            ${{ env.IMAGE }}:sha-${{ env.SOURCE_COMMIT }}
            ${{ !contains(env.RELEASE_TAG, '-') && format('{0}:latest', env.IMAGE) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_COMMIT }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Prepare release directory
        run: |
          mkdir release-assets frontend-inventory
          cp frontend/package.json frontend/package-lock.json frontend-inventory/
      - name: Generate image SBOM by immutable digest
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ github.token }}
          syft-version: v1.57.1
          format: spdx-json
          output-file: release-assets/image.sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Inventory bundled frontend dependencies
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        env:
          SYFT_JAVASCRIPT_INCLUDE_DEV_DEPENDENCIES: "true"
          SYFT_SOURCE_NAME: subscribed-frontend
          SYFT_SOURCE_VERSION: ${{ env.RELEASE_TAG }}
        with:
          path: frontend-inventory
          syft-version: v1.57.1
          format: spdx-json
          output-file: release-assets/frontend.sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate SHA information and release notes
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release_metadata.py assets \
            --tag "$RELEASE_TAG" --commit "$SOURCE_COMMIT" \
            --image "$IMAGE" --digest "$IMAGE_DIGEST" \
            --repository "$GITHUB_REPOSITORY" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --output-dir release-assets
      - name: Create or resume draft release, then publish
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json; then
            jq -e '.isDraft == true' release-state.json > /dev/null || {
              echo "Release already published; refusing to replace its assets." >&2
              exit 1
            }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" \
              --notes-file release-assets/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" \
            release-assets/image.sbom.spdx.json release-assets/frontend.sbom.spdx.json \
            release-assets/release.json release-assets/SOURCE_COMMIT.txt \
            release-assets/IMAGE_DIGEST.txt release-assets/SHA256SUMS --clobber
          prerelease=false
          [[ "$RELEASE_TAG" != *-* ]] || prerelease=true
          gh release edit "$RELEASE_TAG" --notes-file release-assets/release-notes.md \
            --prerelease="$prerelease" --draft=false
          cat release-assets/release-notes.md >> "$GITHUB_STEP_SUMMARY"
