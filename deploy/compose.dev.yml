# LOCAL DEVELOPMENT ONLY (design §10.2). A throwaway Keycloak in start-dev mode on port 8180 that
# imports a realm containing ONLY the confidential client (no users, no passwords, no secret).
#   KC_DEV_ADMIN_PASSWORD="$(openssl rand -hex 16)" docker compose -f deploy/compose.dev.yml up -d keycloak
#   bash scripts/dev-keycloak-users.sh        # synthetic users + client secret, printed once
# Never expose this service beyond localhost.
name: subscribed-dev

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm", "--http-port=8180"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: dev-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_DEV_ADMIN_PASSWORD:?generate a random KC_DEV_ADMIN_PASSWORD}
      KC_HOSTNAME: http://localhost:8180
    ports:
      - "127.0.0.1:8180:8180"
    volumes:
      - ./keycloak/dev-realm.json:/opt/keycloak/data/import/subscribed-dev-realm.json:ro
